

export RISCV_GCC=/usr
export RISCV_ARCH=riscv64-unknown-elf

#export RISCV=$(RISCV_GCC)/$(RISCV_ARCH)
#export RISCV=$(RISCV_GCC)
export RISCV=/usr/lib/picolibc/riscv64-unknown-elf

export LLVM=/usr

CC      = /usr/bin/$(RISCV_ARCH)-gcc
AR      = /usr/bin/$(RISCV_ARCH)-ar
OBJDUMP = /usr/bin/$(RISCV_ARCH)-objdump
SIZE    = /usr/bin/$(RISCV_ARCH)-size
OBJCOPY = /usr/bin/$(RISCV_ARCH)-objcopy
#PK      = $(RISCV)/riscv32-unknown-elf/bin/pk
LD      = /usr/bin/$(RISCV_ARCH)-ld

LLVMCC  = /usr/bin/clang
# LLVMCC = $(RISCV)/bin/$(RISCV_ARCH)-gcc

XLEN            = 32

CONF_ARCH       = rv32imac_zicsr

CONF_ABI        = ilp32

CONF_CFLAGS     = -Os -march=$(CONF_ARCH) -mabi=$(CONF_ABI)
#CONF_CFLAGS = -Os -march=$(CONF_ARCH) -mabi=$(CONF_ABI) --sysroot=$(RISCV_SYSROOT)
